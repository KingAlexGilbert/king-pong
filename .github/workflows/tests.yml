name: Cross-Platform Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      extended:
        description: Run additional release browser and offline LAN checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cross-platform-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node and Python Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run JavaScript tests
        run: node --test tests/*.mjs

      - name: Run Python tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v

  online:
    name: Browser Multiplayer and Signaling
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: signaling
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - name: Install development tools
        run: npm ci
      - name: Test signaling and room cleanup
        run: npm test
      - name: Validate Worker deployment bundle
        run: npm run check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Run every standard browser regression gate
        run: node ../tools/test.mjs browser
      - name: Run extended release checks
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        run: node ../tools/test.mjs extended
