name: Cross-Platform Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node and Python Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run JavaScript tests
        run: node --test tests/*.mjs

      - name: Run Python tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v

  online:
    name: Browser Multiplayer and Signaling
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: signaling
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: signaling/package-lock.json
      - name: Install development tools
        run: npm ci
      - name: Test signaling and room cleanup
        run: npm test
      - name: Validate Worker deployment bundle
        run: npm run check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test real browser peers and existing gameplay
        run: npm run test:browser
      - name: Test approval, moderation and private ready flow with real WebRTC
        run: npm run test:private-rooms
      - name: Test deterministic private-room admission and gameplay lifecycle
        run: npm run test:private-rooms-controlled
      - name: Test coordinated WebRTC recovery and encrypted WebSocket fallback
        run: node test/private-room-browser.mjs --controlled-channels --transport-recovery
      - name: Test encrypted WebSocket backpressure and reliable controls
        run: node test/private-room-browser.mjs --websocket-fallback --transport-faults
      - name: Test saved preferences, perspective and layout in every build
        run: npm run test:preferences
      - name: Test automatic cross-build matchmaking with real WebRTC
        run: npm run test:matchmaking
      - name: Test online menu and synchronized ready flow with controlled channels
        run: npm run test:online-flow
      - name: Test compact networking with latency, jitter, loss and recovery
        run: npm run test:network
      - name: Test new title tiles, approved icons and effective audio controls
        run: npm run test:powerup-ui
      - name: Test gameplay, selections, saves and touch layouts in every HTML build
        run: npm run test:gameplay
      - name: Test contextual UI, accessibility and phone rotation
        run: npm run test:ui
      - name: Test campaign level selection, saved progression and music settings layout
        run: npm run test:level-select
      - name: Test desktop centering and high-refresh rally transitions
        run: npm run test:engineering
      - name: Test rendered serves and authoritative snapshot playback at five refresh rates
        run: npm run test:serve
      - name: Test ripple rendering and independent ball motion at four refresh rates
        run: npm run test:ripple
      - name: Test ball appearance and immediate pause/resume presentation
        run: npm run test:appearance
